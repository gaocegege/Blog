<div class="summer-author-info">
    <div class="row">
        <section class="summer-post-author small-12 columns">

            {% capture avatar_path %}/images/{{ site.owner.avatar }}{% endcapture %}
            <img src="{{ avatar_path | relative_url }}" class="summer-post-author-avatar" alt="{{ site.owner.name }}">

            <span class="author-label">Author</span>
            <h1>{{ site.owner.name }}</h1>

            <p><a href="mailto:{{ site.owner.email }}" class="author-website">{{ site.owner.email }}</a>
            </p>

            <p class="author-label">{{ site.owner.description }}
            </p>

        </section>
    </div>
</div>
