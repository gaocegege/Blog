disqus_shortname: blogofcece
share:            true
highlight:        true
dropcap:          true
# Public site: https://gaocegege.com/Blog
# Keep the origin and deployment subpath separate for Jekyll URL filters.
url:              https://gaocegege.com
baseurl:          /Blog

# Owner/author information
owner:
  name:           高策
  avatar:         gaocegege.jpg
  email:          gaocegege@hotmail.com
  wechat:         270863799
  # Use the coder's toolbox at http://coderstoolbox.net/string/#!encoding=xml&action=encode&charset=us_ascii to encode your description into XML string
  description:    Done is better than perfect.
  # Social networking links used in footer. Update and remove as you like.
  weibo:          constructcece
  twitter:
  github:         gaocegege
  instagram:

# Webmaster verification
google_verify:
# https://ssl.bing.com/webmaster/configure/verify/ownership Option 2 content= goes here
bing_verify:

# Links to include in footer navigation
# For external links add external: true
links:
  - title: 主页
    url: /
    external: false
    icon: home
  - title: 编程
    url: /featured
  - title: 消遣
    url: /relaxed
  - title: 分类
    url: /categories
  - title: 关于我
    url: /about
  - title: 博客数据统计
    url: /analytics
  - title: 开源项目
    url: /opensource
  # - title: Link
  #   url: /link
  - title: RSS
    url: /rss.xml

timezone:    Asia/Shanghai
future:      true
highlighter: rouge
markdown:    kramdown
# Keep the initial page light while preserving the historical archive via pagination.
paginate:    25
paginate_path: "page:num"
plugins:
  - jekyll-paginate

# Categories are part of historical URLs; do not normalize them without redirects.
permalink:   /:categories/:title

kramdown:
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6

include: [".htaccess"]
exclude: ["bin", "vendor", "README.md", "lib", "config.rb", "Gemfile", "Capfile", "Gemfile.lock", "config", "log", "Rakefile", "Rakefile.rb", "tmp", "less", "*.sublime-project", "*.sublime-workspace", "test", "spec", "Gruntfile.js", "package.json", "node_modules"]
