<div class="summer-post-share row">
    <div class="small-12 columns">
        <a href="https://twitter.com/intent/tweet?text={{ .Title }}&url={{ .Permalink }}" target="_blank" title="Share on Twitter">
            <i class="fa fa-twitter"></i>
        </a>
        <a href="https://www.facebook.com/sharer/sharer.php?u={{ .Permalink }}" target="_blank" title="Share on Facebook">
            <i class="fa fa-facebook"></i>
        </a>
        <a href="https://plus.google.com/share?url={{ .Permalink }}" target="_blank" title="Share on Google+">
            <i class="fa fa-google-plus"></i>
        </a>
    </div>
</div>
